spring.application.name=common-login-module

spring.datasource.url=jdbc:h2:mem:common_login;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HS256 secret must be provided via the APP_JWT_SECRET environment variable (Base64, at least 256 bits).
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=common-login-module
